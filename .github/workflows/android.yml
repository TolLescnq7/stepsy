name: android
on: 
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: motionmate.apk
          path: app/build/outputs/apk/full/debug/*.apk
